name: v0.4.0-alpha.5 integration gate

on:
  workflow_dispatch:
  push:
    branches:
      - release/v0.4.0-alpha.5-candidate

permissions:
  contents: read

concurrency:
  group: v040-alpha5-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: PostgreSQL 16, Redis 7 and Mailpit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete fail-closed gate
        run: npm test
