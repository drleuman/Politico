# Configuración Directiva Nginx Ámbito Servidor Plesk — Política Canon v0.4.0-alpha.6
# Ubicación en Plesk: Dominio -> Apache & Nginx Settings -> Additional Nginx Directives
# NOTA IMPORTANTE: No declarar 'location /' aquí para evitar la colisión 'duplicate location "/"' generada por la plantilla base de Plesk.

# Autenticación HTTP Basic Obligatoria aplicada a todo el sitio Nginx (Ámbito Server)
auth_basic "Acceso Restringido — Intranet Política Canon";
auth_basic_user_file /etc/nginx/htpasswd_politica_canon;

