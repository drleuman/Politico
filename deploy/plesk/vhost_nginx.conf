# Configuración de Reverse Proxy Nginx para Plesk — Política Canon v0.3.5
# Ubicación en Plesk: Dominio -> Apache & Nginx Settings -> Additional Nginx Directives

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Autenticación HTTP Basic Obligatoria para Acceso a Intranet Privada
    auth_basic "Acceso Restringido — Intranet Política Canon";
    auth_basic_user_file /etc/nginx/htpasswd_politica_canon;
}
