services:
  postgres_audit:
    image: postgres:16-alpine
    container_name: politica_canon_pg16_audit
    environment:
      POSTGRES_DB: politica_canon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for the isolated audit stack}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d politica_canon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_audit:
    image: redis:7-alpine
    container_name: politica_canon_redis_audit
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit_audit:
    image: axllent/mailpit:v1.21
    container_name: politica_canon_mailpit_audit
    ports:
      - "${SMTP_PORT:-11025}:1025"
      - "${MAILPIT_UI_PORT:-18025}:8025"
    environment:
      MP_MAX_MESSAGES: 5000
